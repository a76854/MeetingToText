# nginx reverse-proxy for MeetingToText frontend
#
# Design intent — each directive maps to an app feature:
#
# - `listen 80 / server_name _ / root /usr/share/nginx/html / index index.html`
#   Canonical nginx static-file serving. Root points at the vite build output
#   (stage1 copies dist → /usr/share/nginx/html). Same-origin deployment:
#   browser loads the SPA and the API under one origin, so CORS is not needed
#   at runtime (see backend/app/config.py cors_origins_from_env docstring:
#   reverse-proxy path preserves same-origin; dev-only CORS on :5173 remains
#   for `vite dev --proxy`).
#
# - `location / { try_files $uri $uri/ /index.html; }`
#   SPA routing fallback. Vue Router uses history mode — every non-file path
#   (e.g. /settings, /transcribe/123) must serve index.html so the client
#   router can resolve it. Aligned with backend StaticFiles SPA fallback in
#   backend/app/server.py (kept for non-container `python main.py` path).
#
# - `location /api/ { proxy_pass http://backend:8000; ... }`
#   Reverse-proxy for all API traffic. `proxy_http_version 1.1` + Upgrade/
#   Connection headers preserve WebSocket upgrade for real-time recording
#   (frontend/src/composables/recorder.ts → backend WebSocket endpoint;
#   vite.config.ts ws:true during dev proves the ws upgrade requirement).
#   Timeouts 300s cover long transcription jobs; client_max_body_size 500m
#   is EXACTLY the backend max_upload_bytes=500M (500*1024*1024) — NOT 512M
#   (Metis finding #11). Larger would mask backend 413 handling; smaller
#   would reject valid uploads prematurely.
#
# - `location /api/transcribe { proxy_buffering off; proxy_read_timeout 600s; ... }`
#   SSE stream endpoint (backend streams transcription events via
#   Server-Sent Events). `proxy_buffering off` is required so nginx flushes
#   each SSE chunk immediately instead of buffering — without it the frontend
#   would stall until the response completes. Scoped to this longest-prefix
#   location only (sibling to /api/); disabling buffering globally would hurt
#   throughput for non-streaming endpoints. 600s read timeout accommodates
#   the longest single-file transcription on CPU.
#
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path that is not a real file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE transcribe stream — longest-prefix match wins over /api/
    # proxy_buffering off ensures each SSE event is flushed immediately
    location /api/transcribe {
        proxy_pass http://backend:8000;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # General API reverse-proxy (includes WebSocket upgrade for live recording)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }
}

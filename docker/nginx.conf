# nginx static host for MeetingToText frontend
#
# Pure static hosting — no reverse proxy. The SPA calls the backend directly
# cross-origin at http://localhost:8000 (VITE_API_BASE_URL injected at build).
# Dev same-origin proxy remains via vite.config.ts server.proxy.
#
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

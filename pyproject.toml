[project]
name = "meetingtotext"
version = "0.1.0"
description = "会议录音转写与纪要生成系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.2.0",
    "websockets>=10.0",
    "openai>=1.60.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "funasr>=1.2.0",
    "torch>=2.5.0",
    "torchaudio>=2.0.0",
    "onnxruntime>=1.6.0",
    "modelscope>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[project.scripts]
meetingtotext = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not system'"
markers = [
    "unit: pure-function hermetic tests with no I/O or external dependencies",
    "integration: TestClient and multi-module tests with real SQLite and fakes for external services",
    "system: tests that execute real FunASR models (deselect by default; run with -o addopts=\"\" -m system)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008 systematically fights FastAPI idioms (`Depends()`/`Path()` in defaults);
# E402 in server.py is the sys.path bootstrap needed for `python server.py`.
# Both are framework-required, suppressed only in the affected modules.
per-file-ignores = { "backend/app/routers/deps.py" = ["B008"], "backend/app/routers/transcribe.py" = ["B008"], "backend/app/routers/upload.py" = ["B008"], "backend/app/server.py" = ["E402"], "backend/app/services/recorder.py" = ["SIM115"], "backend/app/templates/presets.py" = ["E501"] }

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "funasr.*",
    "torch.*",
    "torchaudio.*",
    "onnxruntime.*",
    "modelscope.*",
    "librosa.*",
    "soundfile.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["backend*"]
